<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growing Heart Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a; /* Темный фон, как на видео */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        canvas {
            display: block;
            /* Легкое свечение для всей картинки */
            filter: drop-shadow(0 0 15px rgba(234, 128, 176, 0.6));
        }
    </style>
</head>
<body>

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        // Настройки размеров
        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Параметры анимации
        const TOTAL_LINES = 180; // Количество лучей (как N=170 в питоне)
        const SCALE = 16;        // Масштаб сердца
        const SPEED = 15;        // Задержка между появлением линий (в миллисекундах)
        
        let currentLine = 0;

        // Функция для получения координат точки на контуре сердца
        // Используем ту же формулу, что и в Python коде
        function getHeartPoint(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            
            // Центрируем и масштабируем
            return {
                x: width / 2 + x * SCALE,
                y: height / 2 + y * SCALE - 30 // Небольшой сдвиг вверх для центровки
            };
        }

        // Функция для получения нежно-розового цвета
        // i от 0 до TOTAL_LINES
        function getPinkColor(i) {
            // Создаем градиент: от бледно-розового к насыщенному и обратно
            const progress = i / TOTAL_LINES;
            
            // Плавное изменение оттенка (Hue) от 320 (розовый) до 350 (малиновый) и обратно
            const hue = 320 + Math.sin(progress * Math.PI) * 30; 
            // Насыщенность: от 50% до 100%
            const saturation = 50 + Math.sin(progress * Math.PI) * 50;
            // Яркость: от 70% до 100%
            const lightness = 70 + Math.sin(progress * Math.PI) * 30;

            return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
        }

        function draw() {
            // Очищаем холст с легким затемнением для создания шлейфа
            ctx.fillStyle = 'rgba(10, 10, 10, 0.2)';
            ctx.fillRect(0, 0, width, height);

            // Рисуем линии от 0 до currentLine
            for (let i = 0; i <= currentLine; i++) {
                // Угол t от 0 до 2*PI
                const t = (i / TOTAL_LINES) * Math.PI * 2;
                
                const point = getHeartPoint(t);
                
                // Начало линии - центр экрана (немного смещен для красоты)
                const startX = width / 2;
                const startY = height / 2 - 30;

                // Настройка стиля линии
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(point.x, point.y);
                
                // Цвет линии
                ctx.strokeStyle = getPinkColor(i);
                // Толщина линии (случайная, как в питоне)
                ctx.lineWidth = Math.random() * 2 + 1; 
                // Прозрачность линии
                ctx.globalAlpha = 0.6 + Math.sin(t) * 0.4; 

                ctx.stroke();
            }

            // Если нарисовали не все линии, увеличиваем счетчик
            if (currentLine < TOTAL_LINES) {
                currentLine++;
                setTimeout(draw, SPEED);
            } else {
                // Когда все линии нарисованы, можно запустить легкое мерцание
                // Для этого просто перерисовываем с небольшой задержкой
                // Но чтобы не перегружать, просто остановимся на достигнутом
            }
        }

        // Запуск анимации
        draw();

        // Дополнительный эффект: легкое "дыхание" сердца после отрисовки
        // (опционально, можно убрать, если не нужно)
        setInterval(() => {
            if (currentLine >= TOTAL_LINES) {
                // Легкое перерисовывание для эффекта мерцания
                ctx.fillStyle = 'rgba(10, 10, 10, 0.1)';
                ctx.fillRect(0, 0, width, height);
                
                for (let i = 0; i <= TOTAL_LINES; i++) {
                    const t = (i / TOTAL_LINES) * Math.PI * 2;
                    const point = getHeartPoint(t);
                    const startX = width / 2;
                    const startY = height / 2 - 30;

                    ctx.beginPath();
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(point.x, point.y);
                    
                    // Слегка меняем яркость для мерцания
                    const hue = 320 + Math.sin(i * 0.1 + Date.now() * 0.001) * 30;
                    ctx.strokeStyle = `hsl(${hue}, 80%, 85%)`;
                    ctx.lineWidth = Math.random() * 2 + 1;
                    ctx.globalAlpha = 0.4 + Math.random() * 0.4;
                    ctx.stroke();
                }
            }
        }, 100);

    </script>
</body>
</html>
